<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="CareBridge is a 100% youth-led initiative supporting, motivating, and empowering children in healthcare."
    />
    <title>CareBridge — Bridging Care and Compassion</title>
    <script>
      // Set the theme BEFORE first paint, otherwise a light-theme visitor sees a
      // dark flash. Deliberately inline and dependency-free: a bundled module is
      // too late, and this must not await React.
      (function () {
        var KEY = 'carebridge-theme';
        try {
          var stored = localStorage.getItem(KEY);
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="CareBridge is a 100% youth-led initiative supporting, motivating, and empowering children in healthcare."
    />
    <title>CareBridge — Bridging Care and Compassion</title>
    <script>
      // Set the theme BEFORE first paint, otherwise a stored light choice flashes dark.
      // Deliberately inline and dependency-free: a bundled module is too late, and this
      // must not await React.
      //
      // A stored choice wins; with nothing stored the first painted frame is LIGHT. There
      // is deliberately NO OS system-preference read here (ROUND6-PLAN 6.1 B20): the site
      // has one default for everyone, and a preference that is still read but no longer
      // acted on is exactly the kind of dead branch the next round trips over.
      (function () {
        var KEY = 'carebridge-theme';
        try {
          var stored = localStorage.getItem(KEY);
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
